<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA 凭证守护</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --background: #0b1120;
      --surface: #111827;
      --surface-raised: #1f2937;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-strong: #2563eb;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body {
      margin: 0;
      padding: 1.5rem;
      max-width: 1100px;
      margin-inline: auto;
      background: var(--background);
      color: var(--text);
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button, input {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .4rem;
    }
    button {
      padding: .5rem .8rem;
      cursor: pointer;
      background: var(--surface-raised);
    }
    button:hover:not(:disabled) { border-color: var(--accent); background: #26364d; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    input { min-width: 0; padding: .5rem .6rem; }
    input::placeholder { color: #64748b; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1, h2, h3 { color: #f8fafc; line-height: 1.25; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; vertical-align: top; padding: .55rem; border-bottom: 1px solid var(--border); }
    th { color: #cbd5e1; background: var(--surface); }
    td { background: #0f172a; }
    pre {
      overflow: auto;
      padding: .8rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      background: var(--surface);
      color: #dbeafe;
    }
    .auth-notice { margin: 0 0 1rem; padding: .8rem 1rem; border: 1px solid #b45309; border-radius: .4rem; background: #451a03; color: #fed7aa; }
    .auth-notice h2 { margin: 0 0 .3rem; color: #fed7aa; font-size: 1rem; }
    .auth-notice p { margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; }
    label { display: grid; gap: .25rem; }
    #message { min-height: 1.5rem; margin-top: .8rem; }
    #groups { display: flex; flex-wrap: wrap; gap: .4rem; }
    .group { border: 1px solid var(--border); border-radius: .35rem; padding: .35rem .55rem; background: var(--surface); }
    @media (max-width: 700px) {
      body { padding: 1rem; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
<main>
  <h1>CPA 凭证守护</h1>
  <p class="muted">Codex 额度所有权与脱敏代理管理。本页面是静态界面；数据通过经过认证的插件路由加载。</p>
  <section id="auth-notice" class="auth-notice" hidden aria-labelledby="auth-notice-heading">
    <h2 id="auth-notice-heading">需要 CPA 管理权限</h2>
    <p id="auth-notice-text">请返回 CPA 管理中心登录，启用“记住密码”，然后刷新本页面。</p>
  </section>
  <section aria-labelledby="settings-heading">
    <h2 id="settings-heading">生效配置</h2>
    <pre id="settings" aria-live="polite">加载中…</pre>
  </section>
  <section aria-labelledby="proxy-heading">
    <h2 id="proxy-heading">代理管理</h2>
    <div class="toolbar">
      <label>按端点或指纹筛选
        <input id="filter" type="search" autocomplete="off" placeholder="proxy.example 或 sha256:">
      </label>
      <label>共享代理 URL（可选）
        <input id="shared-proxy" type="url" autocomplete="off" placeholder="http://proxy.example:8080">
      </label>
      <button id="preview" type="button">预览所选变更</button>
      <button id="apply" type="button" disabled>应用预览</button>
      <button id="refresh" type="button">刷新状态</button>
    </div>
    <div class="toolbar" style="margin-top:.7rem">
      <label>无令牌连通性测试代理
        <input id="test-proxy" type="url" autocomplete="off" placeholder="socks5://proxy.example:1080">
      </label>
      <button id="test" type="button">测试代理</button>
    </div>
    <p class="muted">结果中的代理 URL 会被脱敏。测试不会使用 CPA 凭证令牌，并且只访问固定的非 Codex 端点。</p>
    <h3>代理分组</h3>
    <div id="groups" aria-live="polite"><span class="muted">加载中…</span></div>
    <div id="message" role="status" aria-live="polite"></div>
    <pre id="results" aria-live="polite"></pre>
    <table>
      <thead><tr><th scope="col">选择</th><th scope="col">凭证</th><th scope="col">已禁用</th><th scope="col">代理端点 / 变更</th><th scope="col">所有权 / 探测</th></tr></thead>
      <tbody id="credentials"><tr><td colspan="5">加载中…</td></tr></tbody>
    </table>
  </section>
</main>
<script>
'use strict';
const state = { status: null, planId: '' };
const el = id => document.getElementById(id);
const text = value => String(value == null ? '' : value);
const safeErrorCodes = new Set([
  'ambiguous_proxy_change', 'auth_index_required', 'body_too_large', 'codex_credential_not_found',
  'content_type_required', 'credential_guard_disabled', 'credential_unavailable', 'duplicate_auth_index',
  'empty_response', 'host_unavailable', 'invalid_batch_size', 'invalid_json', 'invalid_proxy',
  'invalid_proxy_batch', 'invalid_response', 'method_not_allowed', 'not_found', 'plan_expired',
  'plan_expired_or_unknown', 'plan_id_required', 'post_save_mismatch', 'proxy_management_disabled',
  'proxy_setup_failed', 'proxy_url_required', 'reachable', 'recovery_disabled', 'recovery_unavailable',
  'request_failed', 'response_read_failed', 'response_too_large', 'revision_unavailable',
  'scan_incomplete', 'stale_preview', 'target_invalid', 'target_reachable_non_success', 'timeout',
  'connection_failed', 'canceled', 'unreachable', 'management_key_required', 'unauthorized', 'forbidden'
]);
const errorLabels = {
  ambiguous_proxy_change: '代理变更不明确',
  auth_index_required: '缺少凭证索引',
  body_too_large: '请求内容过大',
  codex_credential_not_found: '未找到 Codex 凭证',
  content_type_required: '需要 JSON 内容类型',
  credential_guard_disabled: '凭证守护未启用',
  credential_unavailable: '凭证不可用',
  duplicate_auth_index: '凭证索引重复',
  empty_response: '响应为空',
  host_unavailable: 'CPA Host API 不可用',
  invalid_batch_size: '批量数量无效',
  invalid_json: 'JSON 格式无效',
  invalid_proxy: '代理地址无效',
  invalid_proxy_batch: '代理批次无效',
  invalid_response: '响应无效',
  method_not_allowed: '不支持此请求方法',
  not_found: '未找到请求资源',
  plan_expired: '预览已过期',
  plan_expired_or_unknown: '预览已过期或不存在',
  plan_id_required: '缺少预览编号',
  post_save_mismatch: '保存后校验不一致',
  proxy_management_disabled: '代理管理未启用',
  proxy_setup_failed: '代理建立失败',
  proxy_url_required: '需要代理 URL',
  reachable: '代理可连通',
  recovery_disabled: '恢复功能未启用',
  recovery_unavailable: '恢复功能不可用',
  request_failed: '请求失败',
  response_read_failed: '响应读取失败',
  response_too_large: '响应过大',
  revision_unavailable: '版本校验不可用',
  scan_incomplete: '扫描未完成',
  stale_preview: '预览已失效，凭证可能已被修改',
  target_invalid: '测试目标无效',
  target_reachable_non_success: '测试目标已连接但返回异常状态',
  timeout: '请求超时',
  connection_failed: '连接失败',
  canceled: '请求已取消',
  unreachable: '代理不可连通',
  management_key_required: '未读取到 CPA 管理密钥，请先登录 CPA 管理中心并启用“记住密码”',
  unauthorized: 'CPA 管理密钥无效或已过期，请重新登录管理中心',
  forbidden: 'CPA 拒绝了管理请求，请检查管理权限'
};
const actionLabels = { set: '设置代理', replace: '替换代理', clear: '清除代理' };
const phaseLabels = {
  owned_disabled: '插件已停用',
  restore_pending_probe: '等待恢复探测',
  probe_pending: '等待探测',
  manual_review: '人工复核'
};
const reasonLabels = {
  codex_usage_limit_reached: 'Codex 额度耗尽',
  codex_quota_evidence: '检测到 Codex 额度证据',
  codex_generic_rate_limit: '通用限流（已启用）',
  oversized_failure: '响应过大',
  bare_429: '未确认额度的 429',
  invalid_failure: '失败信息无效',
  non_quota_failure: '非额度错误',
  recovery_error: '恢复错误',
  host_error: 'Host API 错误',
  unverifiable_pending_enable: '待恢复状态无法验证',
  disable_revision_unavailable: '停用版本不可用',
  post_enable_revision_unavailable: '恢复后版本不可用',
  post_enable_guard_unavailable: '恢复后校验不可用',
  redisable_failed: '重新停用失败',
  redisable_revision_unavailable: '重新停用版本不可用',
  ownership_guard_failed: '所有权校验失败',
  probe_unavailable: '探测不可用',
  probe_error: '探测错误',
  health_client_unavailable: '健康检查不可用',
  proxy_setup_failed: '代理建立失败',
  request_failed: '请求失败',
  timeout: '请求超时',
  connection_failed: '连接失败',
  canceled: '请求已取消',
  empty_response: '空响应',
  response_read_failed: '响应读取失败',
  response_too_large: '响应过大',
  auth_failed: '认证失败',
  unexpected_status: '状态异常',
  invalid_inventory: '额度清单无效',
  quota_exhausted: '额度仍已耗尽',
  save_failed: '保存失败',
  revision_unavailable: '版本校验不可用',
  stale_preview: '预览已失效',
  post_save_mismatch: '保存后校验不一致',
  unknown_phase: '未知恢复阶段'
};
const probeStatusLabels = { success: '成功', exhausted: '仍然耗尽', ambiguous: '结果不明确', error: '错误' };
const configLabels = {
  enabled: '插件已启用',
  state_dir_configured: '已配置持久化状态目录',
  recovery_enabled: '启用额度恢复',
  scan_interval: '扫描间隔',
  initial_backoff: '初始退避时间',
  max_backoff: '最大退避时间',
  probe_enabled: '启用额度探测',
  probe_provider: '探测提供方',
  probe_model_configured: '已配置探测模型',
  probe_timeout: '探测超时',
  quota_detection_enabled: '启用额度检测',
  detect_http_429: '检测 HTTP 429',
  classify_generic_rate_limit: '分类通用限流',
  proxy_management_enabled: '启用代理管理'
};
const panelAuthStorageKey = 'cli-proxy-auth';
const panelAuthPrefix = 'enc::v1::';
const panelAuthSalt = 'cli-proxy-api-webui::secure-storage';
const stringValue = value => typeof value === 'string' ? value.trim() : '';
function decodePanelAuth(value) {
  if (!value.startsWith(panelAuthPrefix)) return value;
  try {
    const binary = atob(value.slice(panelAuthPrefix.length));
    const encrypted = Uint8Array.from(binary, character => character.charCodeAt(0));
    const key = new TextEncoder().encode(`${panelAuthSalt}|${window.location.host}|${navigator.userAgent}`);
    const decoded = new Uint8Array(encrypted.length);
    for (let index = 0; index < encrypted.length; index += 1) decoded[index] = encrypted[index] ^ key[index % key.length];
    return new TextDecoder().decode(decoded);
  } catch (_) {
    return '';
  }
}
function normalizeManagementBase(value) {
  const trimmed = stringValue(value).replace(/\/+$/, '');
  if (!trimmed || trimmed === window.location.origin) return '';
  return /^https?:\/\//i.test(trimmed) ? trimmed : `http://${trimmed}`;
}
function managementSession() {
  try {
    const stored = window.localStorage.getItem(panelAuthStorageKey);
    if (!stored) return null;
    const decoded = JSON.parse(decodePanelAuth(stored));
    const root = decoded && typeof decoded === 'object' ? decoded : {};
    const savedState = root.state && typeof root.state === 'object' ? root.state : root;
    const managementKey = stringValue(savedState.managementKey);
    if (!managementKey) return null;
    return { baseURL: normalizeManagementBase(savedState.apiBase), managementKey };
  } catch (_) {
    return null;
  }
}
function setAuthNotice(code) {
  const notice = el('auth-notice');
  const noticeText = el('auth-notice-text');
  if (!notice || !noticeText) return;
  notice.hidden = !code;
  if (code === 'management_key_required') noticeText.textContent = '请返回 CPA 管理中心登录，启用“记住密码”，然后刷新本页面。';
  else if (code === 'unauthorized') noticeText.textContent = 'CPA 管理密钥无效或已过期，请返回管理中心重新登录并刷新本页面。';
  else if (code === 'forbidden') noticeText.textContent = 'CPA 拒绝了管理请求，请确认当前账号具有管理权限。';
}
const safeErrorCode = (value, fallback = 'request_failed') => {
  const code = text(value);
  return !code ? fallback : (safeErrorCodes.has(code) ? code : fallback);
};
function errorLabel(value, fallback = '请求失败') {
  const code = safeErrorCode(value, '');
  return code ? (errorLabels[code] || '安全错误') : fallback;
}
function actionLabel(value) { return actionLabels[text(value)] || '代理变更'; }
function phaseLabel(value) { return phaseLabels[text(value)] || '未知阶段'; }
function reasonLabel(value) { return reasonLabels[text(value)] || '其他原因'; }
function probeStatusLabel(value) { return probeStatusLabels[text(value)] || '结果不明确'; }
function message(value, error) { const node = el('message'); node.textContent = text(value); node.className = error ? 'error' : ''; }
async function api(path, options) {
  const session = managementSession();
  if (!session) {
    setAuthNotice('management_key_required');
    throw new Error('management_key_required');
  }
  const requestOptions = Object.assign({}, options || {});
  requestOptions.credentials = 'omit';
  const headers = new Headers(requestOptions.headers || {});
  headers.set('Accept', 'application/json');
  headers.set('Content-Type', 'application/json');
  headers.delete('Cookie');
  headers.delete('Proxy-Authorization');
  headers.set('Authorization', `Bearer ${session.managementKey}`);
  requestOptions.headers = headers;
  const response = await fetch(`${session.baseURL}/v0/management/plugins/cpa-credential-guard${path}`, requestOptions);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const fallback = response.status === 401 ? 'unauthorized' : (response.status === 403 ? 'forbidden' : 'request_failed');
    const code = safeErrorCode(data.error, fallback);
    if (code === 'unauthorized' || code === 'forbidden') setAuthNotice(code);
    throw new Error(code);
  }
  setAuthNotice('');
  return data;
}
function localizedSettings(config) {
  const output = {};
  Object.entries(config || {}).forEach(([key, value]) => {
    output[configLabels[key] || key] = typeof value === 'boolean' ? (value ? '是' : '否') : value;
  });
  return output;
}
function ownershipText(ownership) {
  if (!ownership) return '非插件所有';
  const probe = ownership.last_probe ? `；最近探测：${probeStatusLabel(ownership.last_probe.status)}` : '';
  return `${phaseLabel(ownership.phase)} / ${reasonLabel(ownership.last_reason)}${probe}`;
}
function render(data) {
  state.status = data;
  el('settings').textContent = JSON.stringify(localizedSettings(data.config || {}), null, 2);
  el('groups').innerHTML = (data.proxy_groups || []).map(group => `<span class="group">${escapeHTML(group.endpoint || group.fingerprint || '未知端点')} × ${escapeHTML(group.count || 0)}</span>`).join('') || '<span class="muted">暂无已配置的代理分组。</span>';
  renderRows();
}
function renderRows() {
  const filter = el('filter').value.trim().toLowerCase();
  const rows = ((state.status && state.status.credentials) || []).filter(row => {
    const proxy = row.proxy || {};
    return !filter || [row.auth_index, row.file_name, proxy.endpoint, proxy.fingerprint].some(value => text(value).toLowerCase().includes(filter));
  }).map(row => {
    const proxy = row.proxy || {};
    const authIndex = text(row.auth_index);
    const endpoint = text(proxy.endpoint) || '无';
    const fingerprint = text(proxy.fingerprint);
    return `<tr><td><input type="checkbox" data-auth-index="${escapeHTML(authIndex)}" aria-label="选择 ${escapeHTML(authIndex)}"></td><td>${escapeHTML(authIndex)}<br><span class="muted">${escapeHTML(row.file_name || '')}</span></td><td>${row.disabled ? '是' : '否'}</td><td>${escapeHTML(endpoint)}<br><span class="muted">${escapeHTML(fingerprint)}</span><br><label class="muted">设置此凭证的代理<input type="url" data-proxy-input="${escapeHTML(authIndex)}" autocomplete="off" placeholder="留空则清除（除非设置了共享值）" aria-label="为 ${escapeHTML(authIndex)} 设置代理"></label></td><td>${escapeHTML(ownershipText(row.ownership))}</td></tr>`;
  }).join('');
  el('credentials').innerHTML = rows || '<tr><td colspan="5">没有匹配的 Codex 凭证。</td></tr>';
}
function mutationResults(items, includeStatus) {
  return (items || []).map(item => {
    const result = {
      '凭证索引': text(item.auth_index),
      '操作': actionLabel(item.action),
      '原代理端点': text(item.old_endpoint) || '无',
      '新代理端点': text(item.new_endpoint) || '无'
    };
    if (includeStatus) result['结果'] = item.ok ? '成功' : '失败';
    result['错误'] = item.error_code ? errorLabel(item.error_code) : '无';
    return result;
  });
}
function testResults(items) {
  return (items || []).map(item => ({
    '代理端点': text(item.endpoint) || '脱敏端点',
    '结果': item.ok ? '可连通' : '不可连通',
    'HTTP 状态码': item.http_status || '无',
    '延迟': item.latency_ms ? `${item.latency_ms} 毫秒` : '无',
    '错误': item.error_code ? errorLabel(item.error_code) : '无'
  }));
}
function escapeHTML(value) { return text(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
async function refresh() {
  try { render(await api('/status')); message('状态已刷新。'); }
  catch (error) { message(errorLabel(error.message, '无法加载状态。'), true); }
}
async function preview() {
  const selected = [...document.querySelectorAll('[data-auth-index]:checked')].map(input => input.dataset.authIndex);
  if (!selected.length) { message('请至少选择一个凭证。', true); return; }
  const shared = el('shared-proxy').value.trim();
  const changes = selected.map(authIndex => {
    const per = [...document.querySelectorAll('[data-proxy-input]')].find(input => input.dataset.proxyInput === authIndex);
    const raw = shared || (per && per.value.trim()) || '';
    return raw ? { auth_index: authIndex, proxy_url: raw } : { auth_index: authIndex, clear: true };
  });
  try {
    const result = await api('/proxy/preview', { method: 'POST', body: JSON.stringify({ changes }) });
    state.planId = result.plan_id || '';
    el('apply').disabled = !state.planId;
    message(`${(result.items || []).length} 项变更已生成预览。请在应用前检查已脱敏的端点。`);
    el('results').textContent = JSON.stringify(mutationResults(result.items, false), null, 2);
  } catch (error) { message(`预览失败：${errorLabel(error.message)}`, true); }
}
async function apply() {
  if (!state.planId) return;
  try {
    const result = await api('/proxy/apply', { method: 'POST', body: JSON.stringify({ plan_id: state.planId }) });
    state.planId = '';
    el('apply').disabled = true;
    const failed = (result.items || []).filter(item => !item.ok).length;
    el('results').textContent = JSON.stringify(mutationResults(result.items, true), null, 2);
    message(failed ? `${failed} 项失败；其余项目已继续处理。` : '代理变更已应用。', Boolean(failed));
    await refresh();
  } catch (error) { message(`应用失败：${errorLabel(error.message)}`, true); }
}
async function testProxy() {
  const raw = el('test-proxy').value.trim();
  if (!raw) { message('请输入要测试的代理 URL。', true); return; }
  try {
    const result = await api('/proxy/test', { method: 'POST', body: JSON.stringify({ proxies: [raw] }) });
    const item = (result.items || [])[0] || {};
    el('results').textContent = JSON.stringify(testResults(result.items), null, 2);
    message(item.ok ? `代理可连通：${item.endpoint || '脱敏端点'}（${item.latency_ms || 0} 毫秒）` : `代理测试失败：${errorLabel(item.error_code, '代理不可连通')}`, !item.ok);
  } catch (error) { message(`代理测试失败：${errorLabel(error.message)}`, true); }
}
el('refresh').addEventListener('click', refresh);
el('preview').addEventListener('click', preview);
el('apply').addEventListener('click', apply);
el('test').addEventListener('click', testProxy);
el('filter').addEventListener('input', renderRows);
refresh();
</script>
</body>
</html>
